<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — JUSHQIN DIGITAL</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-mark">J</span>
        <span>JUSHQIN OS</span>
      </div>
      <h1>Control Center</h1>
      <p class="text-muted">Demo credentials: jushqin2013 / 222222</p>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrap">
            <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password">
            <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Show password">👁</button>
          </div>
        </div>
        <div class="form-group remember-row">
          <label><input type="checkbox" id="remember"> Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%">Sign In</button>
        <div id="login-error" class="login-error"></div>
      </form>
      <p class="login-note">Frontend-only demo auth. Not secure for production. Use backend authentication in real apps.</p>
      <a href="../index.html" class="back-link">← Back to website</a>
    </div>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
